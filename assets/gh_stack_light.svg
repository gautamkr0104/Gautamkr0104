<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 214" width="880" height="214" role="img" aria-label="Verified Languages and Technical Skills (Light)">
  <defs>
    <linearGradient id="ambientBgSL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6f8fa"/>
      <stop offset="55%" stop-color="#eef1f5"/>
      <stop offset="100%" stop-color="#e9edf2"/>
    </linearGradient>
    <linearGradient id="glassSurfaceSL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.82"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.56"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.72"/>
    </linearGradient>
    <linearGradient id="insetBayL" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e5e9ef" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#f6f8fa" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="bevelBorderSL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="40%" stop-color="#d0d7de" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#afb8c1" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="frostGrainSL" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="2" seed="11" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="mono"/>
      <feComponentTransfer in="mono" result="grain">
        <feFuncA type="linear" slope="0.02"/>
      </feComponentTransfer>
      <feBlend mode="multiply" in="SourceGraphic" in2="grain"/>
    </filter>
    <clipPath id="plateClipSL">
      <rect x="0" y="0" width="880" height="214" rx="14"/>
    </clipPath>
    <pattern id="microGridSL" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.65" fill="#1f2328" fill-opacity="0.07"/>
    </pattern>
  </defs>

  <g clip-path="url(#plateClipSL)">
    <rect width="880" height="214" fill="url(#ambientBgSL)"/>
    <rect width="880" height="214" fill="url(#microGridSL)"/>

    <rect x="8" y="8" width="864" height="198" rx="12" fill="url(#glassSurfaceSL)" filter="url(#frostGrainSL)"/>
    <rect x="8.5" y="8.5" width="863" height="197" rx="11.5" fill="none" stroke="url(#bevelBorderSL)" stroke-width="1"/>

    <g transform="translate(24, 22)">
      <rect width="376" height="170" rx="9" fill="url(#insetBayL)" stroke="#d0d7de" stroke-width="1"/>
      <line x1="12" y1="0.7" x2="364" y2="0.7" stroke="#ffffff" stroke-opacity="0.9" stroke-width="0.75"/>

      <text x="16" y="21" fill="#1a7f37" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" letter-spacing="1.2">05 · LANGUAGES</text>
      <text x="360" y="21" text-anchor="end" fill="#6e7781" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5">15 REPOS // AUDITED</text>

      <rect x="16" y="32" width="192" height="5" rx="2.5" fill="#1a7f37"/>
      <rect x="210" y="32" width="46" height="5" rx="2" fill="#24292f"/>
      <rect x="258" y="32" width="45" height="5" rx="2" fill="#57606a"/>
      <rect x="305" y="32" width="33" height="5" rx="2" fill="#8c959f"/>
      <rect x="340" y="32" width="20" height="5" rx="2" fill="#afb8c1"/>

      <circle cx="20" cy="59" r="3" fill="#1a7f37"/>
      <text x="30" y="62.5" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">Python</text>
      <text x="142" y="62.5" fill="#57606a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11">Edge-AI, AST, CV, APIs</text>
      <text x="360" y="62.5" text-anchor="end" fill="#24292f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">55.7%</text>

      <circle cx="20" cy="83" r="3" fill="#24292f"/>
      <text x="30" y="86.5" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">TypeScript</text>
      <text x="142" y="86.5" fill="#57606a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11">Next.js, React, Fastify</text>
      <text x="360" y="86.5" text-anchor="end" fill="#24292f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">13.5%</text>

      <circle cx="20" cy="107" r="3" fill="#57606a"/>
      <text x="30" y="110.5" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">JS / HTML / CSS</text>
      <text x="142" y="110.5" fill="#57606a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11">WASM Edge &amp; Dashboards</text>
      <text x="360" y="110.5" text-anchor="end" fill="#24292f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">13.2%</text>

      <circle cx="20" cy="131" r="3" fill="#8c959f"/>
      <text x="30" y="134.5" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">Java / Kotlin</text>
      <text x="142" y="134.5" fill="#57606a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11">LSPosed, Compose, Room</text>
      <text x="360" y="134.5" text-anchor="end" fill="#24292f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">9.5%</text>

      <circle cx="20" cy="155" r="3" fill="#afb8c1" stroke="#57606a" stroke-width="0.8"/>
      <text x="30" y="158.5" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">C / C++11</text>
      <text x="142" y="158.5" fill="#57606a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11">ESP-IDF, FreeRTOS, BLE</text>
      <text x="360" y="158.5" text-anchor="end" fill="#24292f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">7.2%</text>
    </g>

    <g transform="translate(414, 22)">
      <rect width="442" height="170" rx="9" fill="url(#insetBayL)" stroke="#d0d7de" stroke-width="1"/>
      <line x1="12" y1="0.7" x2="430" y2="0.7" stroke="#ffffff" stroke-opacity="0.9" stroke-width="0.75"/>

      <text x="16" y="21" fill="#57606a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" letter-spacing="1.2">06 · VERIFIED STACK &amp; TOOLING</text>
      <text x="426" y="21" text-anchor="end" fill="#6e7781" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5">PRODUCTION DEPS</text>
      <line x1="16" y1="31" x2="426" y2="31" stroke="#d0d7de" stroke-width="1"/>

      <text x="16" y="51" fill="#6e7781" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.8">EMBEDDED</text>
      <text x="86" y="51" fill="#1f2328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.2">ESP32 / ESP-IDF · FreeRTOS · OV5640 · MPU6050 · BLE HID</text>

      <line x1="16" y1="61" x2="426" y2="61" stroke="#d8dee4" stroke-width="1"/>
      <text x="16" y="77" fill="#6e7781" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.8">ANDROID</text>
      <text x="86" y="77" fill="#1f2328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.2">LSPosed / Xposed · Keystore Crypto · Jetpack Compose · Room</text>

      <line x1="16" y1="87" x2="426" y2="87" stroke="#d8dee4" stroke-width="1"/>
      <text x="16" y="103" fill="#6e7781" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.8">AI &amp; AST</text>
      <text x="86" y="103" fill="#1f2328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.2">TFLite FP16 · OpenCV · MediaPipe · Tree-sitter · NetworkX</text>

      <line x1="16" y1="113" x2="426" y2="113" stroke="#d8dee4" stroke-width="1"/>
      <text x="16" y="129" fill="#6e7781" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.8">BACKEND</text>
      <text x="86" y="129" fill="#1f2328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.2">FastAPI · Fastify · Flask · PostgreSQL · Redis · Celery · Docker</text>

      <line x1="16" y1="139" x2="426" y2="139" stroke="#d8dee4" stroke-width="1"/>
      <text x="16" y="155" fill="#6e7781" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.8">WEB &amp; QA</text>
      <text x="86" y="155" fill="#1f2328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.2">Next.js 15 · React 19 · D3 / ReactFlow · Pytest · Jest · Vitest</text>
    </g>
  </g>
</svg>
