<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 214" width="880" height="214" role="img" aria-label="Verified Languages and Technical Skills">
  <defs>
    <linearGradient id="ambientBgS" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0d11"/>
      <stop offset="55%" stop-color="#111419"/>
      <stop offset="100%" stop-color="#0d1014"/>
    </linearGradient>
    <radialGradient id="topLightS" cx="76%" cy="10%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.085"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glassSurfaceS" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="50%" stop-color="#d1d5db" stop-opacity="0.022"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.038"/>
    </linearGradient>
    <linearGradient id="insetBay" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#07090c" stop-opacity="0.52"/>
      <stop offset="100%" stop-color="#151920" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="bevelBorderS" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="35%" stop-color="#d1d5db" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.14"/>
    </linearGradient>
    <linearGradient id="bayBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.07"/>
    </linearGradient>
    <filter id="frostGrainS" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="2" seed="11" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="mono"/>
      <feComponentTransfer in="mono" result="grain">
        <feFuncA type="linear" slope="0.026"/>
      </feComponentTransfer>
      <feBlend mode="screen" in="SourceGraphic" in2="grain"/>
    </filter>
    <clipPath id="plateClipS">
      <rect x="0" y="0" width="880" height="214" rx="14"/>
    </clipPath>
    <pattern id="microGridS" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.6" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <g clip-path="url(#plateClipS)">
    <rect width="880" height="214" fill="url(#ambientBgS)"/>
    <rect width="880" height="214" fill="url(#microGridS)"/>
    <rect width="880" height="214" fill="url(#topLightS)"/>

    <rect x="8" y="8" width="864" height="198" rx="12" fill="url(#glassSurfaceS)" filter="url(#frostGrainS)"/>
    <line x1="22" y1="8.7" x2="858" y2="8.7" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1"/>
    <rect x="8.5" y="8.5" width="863" height="197" rx="11.5" fill="none" stroke="url(#bevelBorderS)" stroke-width="1"/>

    <!-- LEFT BAY: 05 · LANGUAGES (Audited across 15 repositories) -->
    <g transform="translate(24, 22)">
      <rect width="376" height="170" rx="9" fill="url(#insetBay)" stroke="url(#bayBorder)" stroke-width="1"/>
      <line x1="12" y1="0.7" x2="364" y2="0.7" stroke="#ffffff" stroke-opacity="0.14" stroke-width="0.75"/>

      <text x="16" y="21" fill="#3fb950" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" letter-spacing="1.2">05 · LANGUAGES</text>
      <text x="360" y="21" text-anchor="end" fill="#6e7681" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5">15 REPOS // AUDITED</text>

      <!-- Composite Segmented Meter (344px total width) -->
      <rect x="16" y="32" width="192" height="5" rx="2.5" fill="#3fb950"/>
      <rect x="210" y="32" width="46" height="5" rx="2" fill="#e6edf3"/>
      <rect x="258" y="32" width="45" height="5" rx="2" fill="#8b949e"/>
      <rect x="305" y="32" width="33" height="5" rx="2" fill="#57606a"/>
      <rect x="340" y="32" width="20" height="5" rx="2" fill="#30363d"/>

      <circle cx="20" cy="59" r="3" fill="#3fb950"/>
      <text x="30" y="62.5" fill="#f0f6fc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">Python</text>
      <text x="142" y="62.5" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11">Edge-AI, AST, CV, APIs</text>
      <text x="360" y="62.5" text-anchor="end" fill="#d0d7de" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">55.7%</text>

      <circle cx="20" cy="83" r="3" fill="#e6edf3"/>
      <text x="30" y="86.5" fill="#f0f6fc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">TypeScript</text>
      <text x="142" y="86.5" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11">Next.js, React, Fastify</text>
      <text x="360" y="86.5" text-anchor="end" fill="#d0d7de" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">13.5%</text>

      <circle cx="20" cy="107" r="3" fill="#8b949e"/>
      <text x="30" y="110.5" fill="#f0f6fc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">JS / HTML / CSS</text>
      <text x="142" y="110.5" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11">WASM Edge &amp; Dashboards</text>
      <text x="360" y="110.5" text-anchor="end" fill="#d0d7de" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">13.2%</text>

      <circle cx="20" cy="131" r="3" fill="#57606a"/>
      <text x="30" y="134.5" fill="#f0f6fc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">Java / Kotlin</text>
      <text x="142" y="134.5" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11">LSPosed, Compose, Room</text>
      <text x="360" y="134.5" text-anchor="end" fill="#d0d7de" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">9.5%</text>

      <circle cx="20" cy="155" r="3" fill="#30363d" stroke="#8b949e" stroke-width="0.8"/>
      <text x="30" y="158.5" fill="#f0f6fc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">C / C++11</text>
      <text x="142" y="158.5" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11">ESP-IDF, FreeRTOS, BLE</text>
      <text x="360" y="158.5" text-anchor="end" fill="#d0d7de" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">7.2%</text>
    </g>

    <!-- RIGHT BAY: 06 · VERIFIED SKILLS & STACK -->
    <g transform="translate(414, 22)">
      <rect width="442" height="170" rx="9" fill="url(#insetBay)" stroke="url(#bayBorder)" stroke-width="1"/>
      <line x1="12" y1="0.7" x2="430" y2="0.7" stroke="#ffffff" stroke-opacity="0.14" stroke-width="0.75"/>

      <text x="16" y="21" fill="#9ca3af" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" letter-spacing="1.2">06 · VERIFIED STACK &amp; TOOLING</text>
      <text x="426" y="21" text-anchor="end" fill="#6e7681" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5">PRODUCTION DEPS</text>
      <line x1="16" y1="31" x2="426" y2="31" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1"/>

      <text x="16" y="51" fill="#6e7681" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.8">EMBEDDED</text>
      <text x="86" y="51" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.2">ESP32 / ESP-IDF · FreeRTOS · OV5640 · MPU6050 · BLE HID</text>

      <line x1="16" y1="61" x2="426" y2="61" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
      <text x="16" y="77" fill="#6e7681" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.8">ANDROID</text>
      <text x="86" y="77" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.2">LSPosed / Xposed · Keystore Crypto · Jetpack Compose · Room</text>

      <line x1="16" y1="87" x2="426" y2="87" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
      <text x="16" y="103" fill="#6e7681" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.8">AI &amp; AST</text>
      <text x="86" y="103" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.2">TFLite FP16 · OpenCV · MediaPipe · Tree-sitter · NetworkX</text>

      <line x1="16" y1="113" x2="426" y2="113" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
      <text x="16" y="129" fill="#6e7681" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.8">BACKEND</text>
      <text x="86" y="129" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.2">FastAPI · Fastify · Flask · PostgreSQL · Redis · Celery · Docker</text>

      <line x1="16" y1="139" x2="426" y2="139" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
      <text x="16" y="155" fill="#6e7681" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.8">WEB &amp; QA</text>
      <text x="86" y="155" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.2">Next.js 15 · React 19 · D3 / ReactFlow · Pytest · Jest · Vitest</text>
    </g>
  </g>
</svg>
