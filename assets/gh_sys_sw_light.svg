<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 196" width="420" height="196" role="img" aria-label="Static Analysis and RF Tooling">
  <defs>
    <linearGradient id="amb" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#f6f8fa"/><stop offset="100%" stop-color="#e9edf2"/></linearGradient>
    <radialGradient id="topL" cx="25%" cy="8%" r="65%"><stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/><stop offset="100%" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#ffffff" stop-opacity="0.86"/><stop offset="100%" stop-color="#ffffff" stop-opacity="0.64"/></linearGradient>
    <linearGradient id="inset" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#e7ecf2" stop-opacity="0.72"/><stop offset="100%" stop-color="#f6f8fa" stop-opacity="0.88"/></linearGradient>
    <linearGradient id="bevel" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#ffffff" stop-opacity="1"/><stop offset="45%" stop-color="#d0d7de" stop-opacity="0.9"/><stop offset="100%" stop-color="#afb8c1" stop-opacity="0.85"/></linearGradient>
    <linearGradient id="cellB" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#d0d7de" stop-opacity="1"/><stop offset="100%" stop-color="#afb8c1" stop-opacity="0.8"/></linearGradient>
    <linearGradient id="wave" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#8c959f" stop-opacity="0.6"/><stop offset="55%" stop-color="#24292f" stop-opacity="0.85"/><stop offset="100%" stop-color="#1a7f37" stop-opacity="1"/></linearGradient>
    <filter id="fg"><feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="2" seed="13" result="n"/><feColorMatrix type="saturate" values="0" in="n" result="m"/><feComponentTransfer in="m" result="g"><feFuncA type="linear" slope="0.018"/></feComponentTransfer><feBlend mode="multiply" in="SourceGraphic" in2="g"/></filter>
    <pattern id="mg" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.65" fill="#1f2328" fill-opacity="0.065"/></pattern>
    <clipPath id="clip"><rect x="0" y="0" width="420" height="196" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="420" height="196" fill="url(#amb)"/>
    <rect width="420" height="196" fill="url(#mg)"/>
    <rect width="420" height="196" fill="url(#topL)"/>
    <rect x="4" y="4" width="412" height="188" rx="12" fill="url(#glass)" filter="url(#fg)"/>
    <rect x="4.5" y="4.5" width="411" height="187" rx="11.5" fill="none" stroke="url(#bevel)" stroke-width="1"/>
    <g transform="translate(18, 16)">
      <rect width="384" height="78" rx="9" fill="url(#inset)" stroke="url(#cellB)" stroke-width="1"/>
      <text x="16" y="22" fill="#57606a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.8" letter-spacing="0.9">03 · STATIC &amp; VISION</text>
      <text x="368" y="22" text-anchor="end" fill="#6e7781" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">Python · AST · OpenCV</text>
      <text x="16" y="47" fill="#1f2328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600">Software Archaeologist</text>
      <text x="16" y="66" fill="#57606a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.2">Verifiable AST graphs + VisionGuard CV safety</text>
    </g>
    <g transform="translate(18, 102)">
      <rect width="384" height="78" rx="9" fill="url(#inset)" stroke="url(#cellB)" stroke-width="1"/>
      <text x="16" y="22" fill="#57606a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.8" letter-spacing="0.9">04 · WIRELESS &amp; RF</text>
      <text x="368" y="22" text-anchor="end" fill="#6e7781" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">C++ · BLE · ESP-IDF</text>
      <text x="16" y="47" fill="#1f2328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600">ESP32-BLE-HID &amp; esp-fly</text>
      <text x="16" y="66" fill="#57606a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.2">Bluetooth LE HID tooling &amp; quadcopter MCU</text>
    </g>
  </g>
</svg>