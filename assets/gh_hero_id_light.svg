      <text x="0" y="50" fill="#1f2328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="-0.6">Gautam Kumar</text>
      <text x="0" y="75" fill="#24292f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.8" letter-spacing="0.5">EMBEDDED · EDGE-AI · KERNEL TOOLING</text>

      <line x1="0" y1="92" x2="376" y2="92" stroke="#d0d7de" stroke-opacity="1" stroke-width="1"/>

      <text x="0" y="118" fill="#57606a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">Deterministic firmware, Android LSPosed hooks,</text>
