    <rect width="420" height="212" fill="url(#mg)"/>
    <rect width="420" height="212" fill="url(#topL)"/>
    <rect x="4" y="4" width="412" height="204" rx="12" fill="url(#glass)" filter="url(#fg)"/>
    <rect x="4.5" y="4.5" width="411" height="203" rx="11.5" fill="none" stroke="url(#bevel)" stroke-width="1"/>
