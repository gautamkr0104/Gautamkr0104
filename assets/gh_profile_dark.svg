<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 312" width="880" height="312" role="img" aria-label="Gautam Kumar — Systems Architecture Overview">
  <defs>
    <!-- Neutral Obsidian & Titanium Backdrop (Zero Purple) -->
    <linearGradient id="ambientBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0d11"/>
      <stop offset="55%" stop-color="#111419"/>
      <stop offset="100%" stop-color="#0d1014"/>
    </linearGradient>

    <!-- Brushed Titanium Top Sheen (Neutral White/Silver Light Source) -->
    <radialGradient id="topLight" cx="22%" cy="8%" r="58%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.11"/>
      <stop offset="48%" stop-color="#9ca3af" stop-opacity="0.035"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Subtle Instrument Emerald Aura behind Telemetry Trace -->
    <radialGradient id="emeraldTraceGlow" cx="84%" cy="32%" r="28%">
      <stop offset="0%" stop-color="#3fb950" stop-opacity="0.11"/>
      <stop offset="65%" stop-color="#3fb950" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Outer Frosted Obsidian Glass Fill -->
    <linearGradient id="glassSurface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.068"/>
      <stop offset="45%" stop-color="#d1d5db" stop-opacity="0.026"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.042"/>
    </linearGradient>

    <!-- Inner Recessed Module Fill -->
    <linearGradient id="insetGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#07090c" stop-opacity="0.58"/>
      <stop offset="100%" stop-color="#14181f" stop-opacity="0.45"/>
    </linearGradient>

    <!-- Cell Frosted Glass Fill -->
    <linearGradient id="cellGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.052"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.015"/>
    </linearGradient>

    <!-- Metallic Specular Bevel Borders -->
    <linearGradient id="bevelBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="28%" stop-color="#d1d5db" stop-opacity="0.09"/>
      <stop offset="72%" stop-color="#9ca3af" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.16"/>
    </linearGradient>

    <linearGradient id="cellBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.11"/>
    </linearGradient>

    <!-- Damped Signal Trace Gradient -->
    <linearGradient id="waveStroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6e7681" stop-opacity="0.5"/>
      <stop offset="55%" stop-color="#d0d7de" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#3fb950" stop-opacity="1"/>
    </linearGradient>

    <!-- Subtle Frosted Grain -->
    <filter id="frostGrain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="2" seed="7" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="mono"/>
      <feComponentTransfer in="mono" result="grain">
        <feFuncA type="linear" slope="0.028"/>
      </feComponentTransfer>
      <feBlend mode="screen" in="SourceGraphic" in2="grain"/>
    </filter>

    <clipPath id="plateClip">
      <rect x="0" y="0" width="880" height="312" rx="14"/>
    </clipPath>

    <pattern id="microGrid" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.6" fill="#ffffff" fill-opacity="0.055"/>
    </pattern>
  </defs>

  <g clip-path="url(#plateClip)">
    <!-- Backdrop & Physical Light Layers -->
    <rect width="880" height="312" fill="url(#ambientBg)"/>
    <rect width="880" height="312" fill="url(#microGrid)"/>
    <rect width="880" height="312" fill="url(#topLight)"/>
    <rect width="880" height="312" fill="url(#emeraldTraceGlow)"/>

    <!-- Smoked Obsidian Frosted Glass Sheet -->
    <rect x="8" y="8" width="864" height="296" rx="12" fill="url(#glassSurface)" filter="url(#frostGrain)"/>
    <!-- Crisp Top Specular Rim -->
    <line x1="22" y1="8.7" x2="858" y2="8.7" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1"/>
    <rect x="8.5" y="8.5" width="863" height="295" rx="11.5" fill="none" stroke="url(#bevelBorder)" stroke-width="1"/>

    <!-- Top Architectural Calibration Header -->
    <g transform="translate(28, 28)">
      <!-- Hardware Status LED + Coordinate -->
      <circle cx="5" cy="6" r="3" fill="#3fb950"/>
      <circle cx="5" cy="6" r="6" fill="#3fb950" fill-opacity="0.16"/>
      <text x="17" y="9.5" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" letter-spacing="1.4">SYS.01 // HARDWARE TO KERNEL</text>

      <!-- Main Identity Lockup -->
      <text x="0" y="42" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="27" font-weight="700" letter-spacing="-0.6">Gautam Kumar</text>
      <text x="0" y="63" fill="#b1bac4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" letter-spacing="0.8">EMBEDDED SYSTEMS · EDGE-AI · RUNTIME INSTRUMENTATION</text>

      <!-- Architectural Thesis (Tight 2 lines, zero hype) -->
      <text x="0" y="94" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.2">Deterministic firmware, OS-level Android framework hooks, and resource-bounded</text>
      <text x="0" y="114" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.2">neural inference pipelines — engineered with machine-verifiable evidence.</text>
    </g>

    <!-- Right Recessed Titanium Telemetry Inset -->
    <g transform="translate(578, 24)">
      <rect width="272" height="128" rx="9" fill="url(#insetGlass)" stroke="url(#cellBorder)" stroke-width="1"/>
      <line x1="12" y1="0.7" x2="260" y2="0.7" stroke="#ffffff" stroke-opacity="0.14" stroke-width="0.75"/>

      <!-- Module Label & Signal Trace -->
      <text x="14" y="20" fill="#6e7681" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" letter-spacing="1.2">SIGNAL TRACE</text>
      <text x="258" y="20" text-anchor="end" fill="#3fb950" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5">DETERMINISTIC</text>

      <!-- Subtle Reference Baseline -->
      <line x1="14" y1="45" x2="258" y2="45" stroke="#ffffff" stroke-opacity="0.06" stroke-dasharray="2 3" stroke-width="1"/>
      <path d="M 14 50 C 42 50, 48 34, 72 38 C 96 42, 108 55, 134 46 C 160 37, 174 30, 198 39 C 222 48, 236 33, 258 31"
            fill="none" stroke="url(#waveStroke)" stroke-width="1.8" stroke-linecap="round"/>
      <circle cx="258" cy="31" r="2.8" fill="#3fb950"/>

      <!-- Hairline Separator -->
      <line x1="14" y1="65" x2="258" y2="65" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1"/>

      <!-- Crisp Spec Ledger -->
      <text x="14" y="82" fill="#6e7681" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">TARGETS</text>
      <text x="76" y="82" fill="#d0d7de" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">ESP32 · Linux · Android</text>

      <text x="14" y="99" fill="#6e7681" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">STACK</text>
      <text x="76" y="99" fill="#d0d7de" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">C · C++ · Python · Java</text>

      <text x="14" y="116" fill="#6e7681" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">CONTACT</text>
      <text x="76" y="116" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">0104.gautam@gmail.com</text>
    </g>

    <!-- Etched Section Groove -->
    <line x1="28" y1="170" x2="852" y2="170" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>

    <!-- Bottom Row: 4 Compact Smoked-Glass Engineering Domain Modules -->
    <!-- Card 01 -->
    <g transform="translate(28, 186)">
      <rect width="197" height="98" rx="9" fill="url(#cellGlass)" stroke="url(#cellBorder)" stroke-width="1"/>
      <line x1="10" y1="0.7" x2="187" y2="0.7" stroke="#ffffff" stroke-opacity="0.16" stroke-width="0.75"/>
      <text x="14" y="21" fill="#3fb950" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" letter-spacing="1">01 · EDGE-AI &amp; MCU</text>
      <text x="14" y="44" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600">KRISHI-DRISHTI</text>
      <text x="14" y="64" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.2">Offline DMA cam + FP16 WASM</text>
      <text x="14" y="83" fill="#6e7681" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.8">ESP32 · FreeRTOS · TFLite</text>
    </g>

    <!-- Card 02 -->
    <g transform="translate(237, 186)">
      <rect width="197" height="98" rx="9" fill="url(#cellGlass)" stroke="url(#cellBorder)" stroke-width="1"/>
      <line x1="10" y1="0.7" x2="187" y2="0.7" stroke="#ffffff" stroke-opacity="0.16" stroke-width="0.75"/>
      <text x="14" y="21" fill="#9ca3af" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" letter-spacing="1">02 · OS INTERNALS</text>
      <text x="14" y="44" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600">AppLocker</text>
      <text x="14" y="64" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.2">System-level LSPosed gate</text>
      <text x="14" y="83" fill="#6e7681" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.8">Java · Xposed · Zero-Net</text>
    </g>

    <!-- Card 03 -->
    <g transform="translate(446, 186)">
      <rect width="197" height="98" rx="9" fill="url(#cellGlass)" stroke="url(#cellBorder)" stroke-width="1"/>
      <line x1="10" y1="0.7" x2="187" y2="0.7" stroke="#ffffff" stroke-opacity="0.16" stroke-width="0.75"/>
      <text x="14" y="21" fill="#9ca3af" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" letter-spacing="1">03 · STATIC &amp; CV</text>
      <text x="14" y="44" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600">SW Archaeologist</text>
      <text x="14" y="64" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.2">Verifiable AST &amp; symbol maps</text>
      <text x="14" y="83" fill="#6e7681" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.8">Python · AST · OpenCV</text>
    </g>

    <!-- Card 04 -->
    <g transform="translate(655, 186)">
      <rect width="197" height="98" rx="9" fill="url(#cellGlass)" stroke="url(#cellBorder)" stroke-width="1"/>
      <line x1="10" y1="0.7" x2="187" y2="0.7" stroke="#ffffff" stroke-opacity="0.16" stroke-width="0.75"/>
      <text x="14" y="21" fill="#9ca3af" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" letter-spacing="1">04 · RF &amp; HID</text>
      <text x="14" y="44" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600">ESP32-BLE-HID</text>
      <text x="14" y="64" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.2">Wireless HID &amp; flight control</text>
      <text x="14" y="83" fill="#6e7681" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.8">C++ · BLE · ESP-IDF</text>
    </g>
  </g>
</svg>
