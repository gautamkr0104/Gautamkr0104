    <linearGradient id="wave" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#6e7681" stop-opacity="0.55"/><stop offset="55%" stop-color="#d0d7de" stop-opacity="0.9"/><stop offset="100%" stop-color="#3fb950" stop-opacity="1"/></linearGradient>
