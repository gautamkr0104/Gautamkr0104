<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 312" width="880" height="312" role="img" aria-label="Gautam Kumar — Systems Architecture Overview (Light)">
  <defs>
    <!-- Brushed Aluminum & Frosted Quartz Backdrop -->
    <linearGradient id="ambientBgL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6f8fa"/>
      <stop offset="55%" stop-color="#eef1f5"/>
      <stop offset="100%" stop-color="#e9edf2"/>
    </linearGradient>

    <radialGradient id="topLightL" cx="22%" cy="8%" r="58%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="glassSurfaceL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.82"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.56"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.72"/>
    </linearGradient>

    <linearGradient id="insetGlassL" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e5e9ef" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#f6f8fa" stop-opacity="0.85"/>
    </linearGradient>

    <linearGradient id="cellGlassL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#f3f5f8" stop-opacity="0.65"/>
    </linearGradient>

    <linearGradient id="bevelBorderL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="35%" stop-color="#d0d7de" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#afb8c1" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="waveStrokeL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8c959f" stop-opacity="0.6"/>
      <stop offset="55%" stop-color="#24292f" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#1a7f37" stop-opacity="1"/>
    </linearGradient>

    <filter id="frostGrainL" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="2" seed="7" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="mono"/>
      <feComponentTransfer in="mono" result="grain">
        <feFuncA type="linear" slope="0.02"/>
      </feComponentTransfer>
      <feBlend mode="multiply" in="SourceGraphic" in2="grain"/>
    </filter>

    <clipPath id="plateClipL">
      <rect x="0" y="0" width="880" height="312" rx="14"/>
    </clipPath>

    <pattern id="microGridL" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.65" fill="#1f2328" fill-opacity="0.07"/>
    </pattern>
  </defs>

  <g clip-path="url(#plateClipL)">
    <rect width="880" height="312" fill="url(#ambientBgL)"/>
    <rect width="880" height="312" fill="url(#microGridL)"/>
    <rect width="880" height="312" fill="url(#topLightL)"/>

    <rect x="8" y="8" width="864" height="296" rx="12" fill="url(#glassSurfaceL)" filter="url(#frostGrainL)"/>
    <rect x="8.5" y="8.5" width="863" height="295" rx="11.5" fill="none" stroke="url(#bevelBorderL)" stroke-width="1"/>

    <g transform="translate(28, 28)">
      <circle cx="5" cy="6" r="3" fill="#1a7f37"/>
      <circle cx="5" cy="6" r="6" fill="#1a7f37" fill-opacity="0.16"/>
      <text x="17" y="9.5" fill="#57606a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" letter-spacing="1.4">SYS.01 // HARDWARE TO KERNEL</text>

      <text x="0" y="42" fill="#1f2328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="27" font-weight="700" letter-spacing="-0.6">Gautam Kumar</text>
      <text x="0" y="63" fill="#424a53" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" letter-spacing="0.8">EMBEDDED SYSTEMS · EDGE-AI · RUNTIME INSTRUMENTATION</text>

      <text x="0" y="94" fill="#57606a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.2">Deterministic firmware, OS-level Android framework hooks, and resource-bounded</text>
      <text x="0" y="114" fill="#57606a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.2">neural inference pipelines — engineered with machine-verifiable evidence.</text>
    </g>

    <g transform="translate(578, 24)">
      <rect width="272" height="128" rx="9" fill="url(#insetGlassL)" stroke="#d0d7de" stroke-width="1"/>
      <line x1="12" y1="0.7" x2="260" y2="0.7" stroke="#ffffff" stroke-opacity="0.9" stroke-width="0.75"/>

      <text x="14" y="20" fill="#6e7781" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" letter-spacing="1.2">SIGNAL TRACE</text>
      <text x="258" y="20" text-anchor="end" fill="#1a7f37" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5">DETERMINISTIC</text>

      <line x1="14" y1="45" x2="258" y2="45" stroke="#1f2328" stroke-opacity="0.08" stroke-dasharray="2 3" stroke-width="1"/>
      <path d="M 14 50 C 42 50, 48 34, 72 38 C 96 42, 108 55, 134 46 C 160 37, 174 30, 198 39 C 222 48, 236 33, 258 31"
            fill="none" stroke="url(#waveStrokeL)" stroke-width="1.8" stroke-linecap="round"/>
      <circle cx="258" cy="31" r="2.8" fill="#1a7f37"/>

      <line x1="14" y1="65" x2="258" y2="65" stroke="#d0d7de" stroke-width="1"/>

      <text x="14" y="82" fill="#6e7781" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">TARGETS</text>
      <text x="76" y="82" fill="#24292f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">ESP32 · Linux · Android</text>

      <text x="14" y="99" fill="#6e7781" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">STACK</text>
      <text x="76" y="99" fill="#24292f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">C · C++ · Python · Java</text>

      <text x="14" y="116" fill="#6e7781" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">CONTACT</text>
      <text x="76" y="116" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">0104.gautam@gmail.com</text>
    </g>

    <line x1="28" y1="170" x2="852" y2="170" stroke="#d0d7de" stroke-width="1"/>

    <g transform="translate(28, 186)">
      <rect width="197" height="98" rx="9" fill="url(#cellGlassL)" stroke="#d0d7de" stroke-width="1"/>
      <line x1="10" y1="0.7" x2="187" y2="0.7" stroke="#ffffff" stroke-width="1"/>
      <text x="14" y="21" fill="#1a7f37" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" letter-spacing="1">01 · EDGE-AI &amp; MCU</text>
      <text x="14" y="44" fill="#1f2328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600">KRISHI-DRISHTI</text>
      <text x="14" y="64" fill="#57606a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.2">Offline DMA cam + FP16 WASM</text>
      <text x="14" y="83" fill="#6e7781" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.8">ESP32 · FreeRTOS · TFLite</text>
    </g>

    <g transform="translate(237, 186)">
      <rect width="197" height="98" rx="9" fill="url(#cellGlassL)" stroke="#d0d7de" stroke-width="1"/>
      <line x1="10" y1="0.7" x2="187" y2="0.7" stroke="#ffffff" stroke-width="1"/>
      <text x="14" y="21" fill="#57606a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" letter-spacing="1">02 · OS INTERNALS</text>
      <text x="14" y="44" fill="#1f2328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600">AppLocker</text>
      <text x="14" y="64" fill="#57606a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.2">System-level LSPosed gate</text>
      <text x="14" y="83" fill="#6e7781" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.8">Java · Xposed · Zero-Net</text>
    </g>

    <g transform="translate(446, 186)">
      <rect width="197" height="98" rx="9" fill="url(#cellGlassL)" stroke="#d0d7de" stroke-width="1"/>
      <line x1="10" y1="0.7" x2="187" y2="0.7" stroke="#ffffff" stroke-width="1"/>
      <text x="14" y="21" fill="#57606a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" letter-spacing="1">03 · STATIC &amp; CV</text>
      <text x="14" y="44" fill="#1f2328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600">SW Archaeologist</text>
      <text x="14" y="64" fill="#57606a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.2">Verifiable AST &amp; symbol maps</text>
      <text x="14" y="83" fill="#6e7781" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.8">Python · AST · OpenCV</text>
    </g>

    <g transform="translate(655, 186)">
      <rect width="197" height="98" rx="9" fill="url(#cellGlassL)" stroke="#d0d7de" stroke-width="1"/>
      <line x1="10" y1="0.7" x2="187" y2="0.7" stroke="#ffffff" stroke-width="1"/>
      <text x="14" y="21" fill="#57606a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" letter-spacing="1">04 · RF &amp; HID</text>
      <text x="14" y="44" fill="#1f2328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600">ESP32-BLE-HID</text>
      <text x="14" y="64" fill="#57606a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.2">Wireless HID &amp; flight control</text>
      <text x="14" y="83" fill="#6e7681" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.8">C++ · BLE · ESP-IDF</text>
    </g>
  </g>
</svg>
